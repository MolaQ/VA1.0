<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B1220">
    <title>VVA · Offline</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0B1220; color: #E6EDF7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.5rem; margin: 20px 0 8px; }
        p { color: #8B9AB3; margin: 4px 0; }
        button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 12px; background: linear-gradient(90deg, #3B82F6, #06B6D4); color: #fff; font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>
    <main>
        <img src="/favicon.svg" alt="VVA">
        <h1>Brak połączenia · You're offline · Sei offline</h1>
        <p>Sprawdź internet i spróbuj ponownie.</p>
        <p>Check your connection and try again.</p>
        <p>Controlla la connessione e riprova.</p>
        <button onclick="location.reload()">↻</button>
    </main>
</body>
</html>
