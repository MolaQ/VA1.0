# VVA – home server stack.  Manage it with ./vva.sh (see deploy/README.md).
#
#   app        FrankenPHP: HTTPS + Laravel + /app WebSocket proxy to Reverb
#   reverb     Laravel Reverb (live stats, online users, toasts)
#   queue      queue:work (AI analysis requests, broadcasts)
#   scheduler  schedule:work (analytics pruning, future jobs)
#   mysql      MySQL 8.4
#   backup     nightly mysqldump + storage archive into ./backups
#   cloudflared  (profile "tunnel") Cloudflare Tunnel – no port forwarding needed

name: vva

x-app: &app
  image: vva-app:${VVA_IMAGE_TAG:-latest}
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    APP_ENV: production
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    # PHP -> Reverb runs inside the Docker network.
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
  volumes:
    - storage:/app/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-VVA}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?run ./vva.sh setup first}
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      SERVER_NAME: ${SERVER_NAME:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=256"]
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vva}
      MYSQL_USER: ${DB_USERNAME:-vva}
      MYSQL_PASSWORD: ${DB_PASSWORD:?run ./vva.sh setup first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run ./vva.sh setup first}
      TZ: ${TZ:-Europe/Warsaw}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_DATABASE: ${DB_DATABASE:-vva}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/storage:ro
    depends_on:
      mysql:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  storage:
  mysql:
  caddy_data:
  caddy_config:
